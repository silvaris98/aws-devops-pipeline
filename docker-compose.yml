version: '3.8'

services:
  app:
    build: .
    container_name: spacexp-app
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: always

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: spacexp-selenium
    shm_size: 2g
    ports:
      - "4444:4444"
      - "7900:7900"
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
