version: '3.7'

services:
  spacexp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacexp-app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  spacexp-selenium:
    image: selenium/standalone-chrome:latest
    container_name: spacexp-selenium
    shm_size: '2gb'
    tmpfs:
      - /tmp
    cap_add:
      - SYS_ADMIN
    depends_on:
      spacexp-app:
        condition: service_healthy
    ports:
      - "4444:4444"
      - "7900:7900"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
